services:
  postgres:
    image: postgres:16-alpine
    container_name: doublemark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doublemark}
      POSTGRES_USER: ${POSTGRES_USER:-doublemark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - doublemark_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doublemark} -d ${POSTGRES_DB:-doublemark}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - doublemark

  api:
    build:
      context: .
      dockerfile: src/DoubleMark.Api/Dockerfile
    container_name: doublemark-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-doublemark};Username=${POSTGRES_USER:-doublemark};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${Jwt__Issuer:-DoubleMark}
      Jwt__Audience: ${Jwt__Audience:-DoubleMark.Desktop}
      Jwt__SigningKey: ${Jwt__SigningKey:?Set Jwt__SigningKey in .env (min 32 chars)}
      Jwt__AccessTokenMinutes: ${Jwt__AccessTokenMinutes:-60}
      Jwt__RefreshTokenDays: ${Jwt__RefreshTokenDays:-30}
      Mail__SmtpHost: ${Mail__SmtpHost:-}
      Mail__SmtpPort: ${Mail__SmtpPort:-587}
      Mail__SmtpUser: ${Mail__SmtpUser:-}
      Mail__SmtpPass: ${Mail__SmtpPass:-}
      Mail__MailFrom: ${Mail__MailFrom:-support@doublemark.ru}
      Mail__SiteBaseUrl: ${Mail__SiteBaseUrl:-https://doublemark.ru}
      Mail__SmtpSecure: ${Mail__SmtpSecure:-true}
      AlphaBank__UserName: ${AlphaBank__UserName:-}
      AlphaBank__Password: ${AlphaBank__Password:-}
      AlphaBank__ApiBaseUrl: ${AlphaBank__ApiBaseUrl:-https://pay.alfabank.ru/payment/rest/}
      AlphaBank__ReturnUrl: ${AlphaBank__ReturnUrl:-https://doublemark.ru/checkout/result}
      AlphaBank__WebhookSecret: ${AlphaBank__WebhookSecret:-}
      AlphaBank__SandboxMode: ${AlphaBank__SandboxMode:-true}
    ports:
      - "127.0.0.1:5080:5080"
    networks:
      - doublemark

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: doublemark-pgweb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGWEB_DATABASE_URL: ${PGWEB_DATABASE_URL:?Set PGWEB_DATABASE_URL in .env}
      PGWEB_AUTH_USER: ${PGWEB_AUTH_USER:-dbadmin}
      PGWEB_AUTH_PASS: ${PGWEB_AUTH_PASS:?Set PGWEB_AUTH_PASS in .env}
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - doublemark

networks:
  doublemark:

volumes:
  doublemark_pgdata:
