# /etc/nginx/sites-available/doublemark.ru
# After certbot: ssl paths are added automatically.

server {
    listen 80;
    listen [::]:80;
    server_name doublemark.ru www.doublemark.ru;

    root /var/www/doublemark;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archive 3.0.x is allowed; keep blocking legacy 2.x installers.
    location ~* ^/downloads/(?:archive/)?DoubleMarkSetup-2\. {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.doublemark.ru;

    location = / {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"service":"DoubleMark.Api","health":"/health"}';
    }

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
